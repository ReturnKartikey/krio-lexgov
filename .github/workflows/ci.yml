name: OpenGov CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opengov_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Backend Lint (Ruff)
        run: |
          ruff check backend/app

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/opengov_db
          SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/opengov_db
        run: |
          cd backend && alembic upgrade head

      - name: Run Pytest Suite with Coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/opengov_db
          SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/opengov_db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          pytest backend/tests -v --cov=backend/app --cov-report=xml --cov-report=term-missing --cov-fail-under=70

  frontend-test:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Frontend Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: Build Next.js Application
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Container Image Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: opengov-api:latest

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: opengov-web:latest
